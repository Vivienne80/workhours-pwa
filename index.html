<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="근무시간">
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>근무시간</title>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 id="page-title">홈</h1>
      <button id="header-action"></button>
    </header>
    <main id="app-main">
      <div style="text-align:center;padding:40px;color:#9e9e9e">불러오는 중...</div>
    </main>
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">오늘</span>
      </button>
      <button class="nav-btn" data-view="monthly">
        <span class="nav-icon">📊</span>
        <span class="nav-label">월간</span>
      </button>
      <button class="nav-btn" data-view="calendar">
        <span class="nav-icon">📅</span>
        <span class="nav-label">달력</span>
      </button>
      <button class="nav-btn" data-view="leave">
        <span class="nav-icon">📋</span>
        <span class="nav-label">연차</span>
      </button>
      <button class="nav-btn" data-view="holidays">
        <span class="nav-icon">🗓️</span>
        <span class="nav-label">휴일</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">설정</span>
      </button>
    </nav>
  </div>

  <div id="modal-overlay" hidden>
    <div id="modal-box"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
